# Read-only: how much x402's own batch-settlement contract is used on Base mainnet. Reads logs
# from the public Base RPC; no secrets, no transactions.
name: measure-x402-batch-settlement

on:
  push:
    branches: [measure-x402-batch-settlement]

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RPC: https://mainnet.base.org
      BS: "0x4020074e9dF2ce1deE5A9C1b5c3f541D02a10003" # x402BatchSettlement (canonical CREATE2 address)
      DAYS: "30"
    steps:
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - run: |
          set -euo pipefail
          [ "$(cast chain-id --rpc-url "$RPC")" = 8453 ]
          ev() { printf '%s=%s\n' "$1" "$(cast keccak "$2")"; }
          C='(address,address,address,address,address,uint40,bytes32)'
          {
            ev ChannelCreated "ChannelCreated(bytes32,$C)"
            ev ChannelClosed "ChannelClosed(bytes32,$C)"
            ev Deposited 'Deposited(bytes32,address,uint128,uint128)'
            ev Claimed 'Claimed(bytes32,address,uint128,uint128)'
            ev Settled 'Settled(address,address,address,uint128)'
            ev Refunded 'Refunded(bytes32,address,uint128)'
            ev WithdrawInitiated 'WithdrawInitiated(bytes32,uint128,uint40)'
            ev WithdrawFinalized 'WithdrawFinalized(bytes32,address,uint128)'
          } > topics.env
          echo "x402BatchSettlement code size on Base: $(cast codesize "$BS" --rpc-url "$RPC") bytes"
          python3 - <<'PY'
          import collections, json, os, subprocess, time
          bs, days = os.environ["BS"].lower(), int(os.environ["DAYS"])
          names = {}
          for line in open("topics.env"):
              k, v = line.strip().split("=")
              names[v.lower()] = k
          def call(url, method, params):
              out = subprocess.run(["cast", "rpc", "--rpc-url", url, "--raw", method, json.dumps(params)],
                                   capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  raise RuntimeError(out.stderr.strip()[-300:])
              return json.loads(out.stdout)
          # Public endpoints rate-limit a single client, so calls rotate across the endpoints that
          # serve a 9,000-block log query, with a pause between calls.
          head = int(call("https://mainnet.base.org", "eth_blockNumber", []), 16)
          STEP = 9000
          urls = []
          for u in ["https://mainnet.base.org", "https://base-rpc.publicnode.com", "https://1rpc.io/base"]:
              try:
                  call(u, "eth_getLogs", [{"address": bs, "fromBlock": hex(head - STEP), "toBlock": hex(head - 1)}])
                  urls.append(u)
              except Exception as e:
                  print(f"skip {u}: {str(e)[:120]}")
          print("rpcs:", ", ".join(urls))
          TRANSIENT = ("429", "request limit", "rate limit", "too many requests", "timed out", "timeout", "502", "503", "504", "connection")
          def getlogs(b, e):
              errs = []
              for attempt in range(4 * len(urls)):
                  try:
                      r = call(urls[attempt % len(urls)], "eth_getLogs", [{"address": bs, "fromBlock": hex(b), "toBlock": hex(e)}])
                      time.sleep(0.4)
                      return r
                  except Exception as ex:
                      errs.append(str(ex)[:120])
                      time.sleep(min(20, 2 + 2 * attempt) if any(k in str(ex).lower() for k in TRANSIENT) else 0.5)
              raise RuntimeError(" | ".join(errs[-2:]))
          start = head - days * 43200          # Base makes a block every 2 s
          counts, daily = collections.Counter(), collections.defaultdict(collections.Counter)
          channels, receivers, payers, tokens, sums = set(), set(), set(), collections.Counter(), collections.Counter()
          step, b, calls, t0, note = STEP, start, 0, time.time(), "complete"
          try:
              while b <= head:
                  if time.time() - t0 > 18 * 60:
                      note = f"stopped at the time budget; covered blocks {start:,}..{b - 1:,}"
                      break
                  e = min(b + step - 1, head)
                  try:
                      logs = getlogs(b, e)
                      calls += 1
                      if calls % 25 == 0:
                          print(f"  {calls} calls, at block {e:,}, events so far {dict(counts)}", flush=True)
                  except Exception as ex:
                      if step > 1000:
                          step //= 2
                          continue
                      raise
                  for l in logs:
                      t = l["topics"]
                      name = names.get(t[0].lower(), "other")
                      counts[name] += 1
                      daily[(int(l["blockNumber"], 16) - start) // 43200][name] += 1
                      amount = int(l["data"][2:66] or "0", 16)
                      if name in ("Deposited", "Claimed", "Settled", "Refunded", "WithdrawFinalized"):
                          sums[name] += amount
                      if name == "ChannelCreated":
                          channels.add(t[1])
                          payers.add("0x" + l["data"][2:][24:64])     # config.payer is the first word
                      if name == "Settled":
                          receivers.add(t[1]); tokens["0x" + t[2][-40:]] += 1
                  b = e + 1
          except Exception as ex:
              note = f"stopped by an error at block {b:,}: {str(ex)[:160]}"
          print(f"window: blocks {start:,}..{head:,} ({days} days); {calls} getLogs calls, final step {step}; {note}")
          print("events:", dict(counts) or "none")
          print(f"channels created: {len(channels)}, distinct payers: {len(payers)}, distinct receivers settled to: {len(receivers)}")
          print("tokens settled:", dict(tokens) or "none")
          for k in ("Deposited", "Claimed", "Settled", "Refunded", "WithdrawFinalized"):
              print(f"{k:18s} total {sums[k] / 1e6:,.6f} (in 6-decimal token units)")
          print("per day (day 0 = oldest):")
          for d in sorted(daily):
              print(f"  day {d:2d}: " + ", ".join(f"{k} {v}" for k, v in sorted(daily[d].items())))
          PY
