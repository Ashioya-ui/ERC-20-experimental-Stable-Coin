# Read-only: how much x402's own batch-settlement contract is used on Base mainnet. Reads logs
# from the public Base RPC; no secrets, no transactions.
name: measure-x402-batch-settlement

on:
  push:
    branches: [measure-x402-batch-settlement]

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RPC: https://mainnet.base.org
      BS: "0x4020074e9dF2ce1deE5A9C1b5c3f541D02a10003" # x402BatchSettlement (canonical CREATE2 address)
      DAYS: "30"
    steps:
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - run: |
          set -euo pipefail
          [ "$(cast chain-id --rpc-url "$RPC")" = 8453 ]
          ev() { printf '%s=%s\n' "$1" "$(cast keccak "$2")"; }
          C='(address,address,address,address,address,uint40,bytes32)'
          {
            ev ChannelCreated "ChannelCreated(bytes32,$C)"
            ev ChannelClosed "ChannelClosed(bytes32,$C)"
            ev Deposited 'Deposited(bytes32,address,uint128,uint128)'
            ev Claimed 'Claimed(bytes32,address,uint128,uint128)'
            ev Settled 'Settled(address,address,address,uint128)'
            ev Refunded 'Refunded(bytes32,address,uint128)'
            ev WithdrawInitiated 'WithdrawInitiated(bytes32,uint128,uint40)'
            ev WithdrawFinalized 'WithdrawFinalized(bytes32,address,uint128)'
          } > topics.env
          echo "x402BatchSettlement code size on Base: $(cast codesize "$BS" --rpc-url "$RPC") bytes"
          python3 - <<'PY'
          import collections, json, os, subprocess, time
          rpc_url, bs, days = os.environ["RPC"], os.environ["BS"].lower(), int(os.environ["DAYS"])
          names = {}
          for line in open("topics.env"):
              k, v = line.strip().split("=")
              names[v.lower()] = k
          def rpc(method, params):
              # Through cast: the public RPC turns away Python's default client.
              err = None
              for attempt in range(6):
                  try:
                      out = subprocess.run(["cast", "rpc", "--rpc-url", rpc_url, "--raw", method, json.dumps(params)],
                                           capture_output=True, text=True, timeout=60)
                      if out.returncode != 0:
                          raise RuntimeError(out.stderr.strip()[-300:])
                      return json.loads(out.stdout)
                  except Exception as e:
                      err = e
                      time.sleep(1 + attempt)
              raise err
          head = int(rpc("eth_blockNumber", []), 16)
          start = head - days * 43200          # Base makes a block every 2 s
          counts, daily = collections.Counter(), collections.defaultdict(collections.Counter)
          channels, receivers, payers, tokens = set(), set(), set(), collections.Counter()
          sums = collections.Counter()
          step, b, calls = 10000, start, 0
          while b <= head:
              e = min(b + step - 1, head)
              try:
                  logs = rpc("eth_getLogs", [{"address": bs, "fromBlock": hex(b), "toBlock": hex(e)}])
                  calls += 1
              except Exception as ex:
                  if step > 250:
                      step //= 2
                      continue
                  raise
              for l in logs:
                  t = l["topics"]
                  name = names.get(t[0].lower(), "other")
                  counts[name] += 1
                  daily[(int(l["blockNumber"], 16) - start) // 43200][name] += 1
                  amount = int(l["data"][2:66] or "0", 16)
                  if name in ("Deposited", "Claimed", "Settled", "Refunded", "WithdrawFinalized"):
                      sums[name] += amount
                  if name == "ChannelCreated":
                      channels.add(t[1])
                      cfg = l["data"][2:]
                      payers.add("0x" + cfg[24:64])                  # config.payer is the first word
                  if name == "Settled":
                      receivers.add(t[1]); tokens["0x" + t[2][-40:]] += 1
              b = e + 1
          print(f"window: blocks {start:,}..{head:,} ({days} days), {calls} getLogs calls, final step {step}")
          print("events:", dict(counts) or "none")
          print(f"channels created: {len(channels)}, distinct payers: {len(payers)}, distinct receivers settled to: {len(receivers)}")
          print("tokens settled:", dict(tokens) or "none")
          for k in ("Deposited", "Claimed", "Settled", "Refunded", "WithdrawFinalized"):
              print(f"{k:18s} total {sums[k] / 1e6:,.6f} (in 6-decimal token units)")
          print("per day (day 0 = oldest):")
          for d in sorted(daily):
              print(f"  day {d:2d}: " + ", ".join(f"{k} {v}" for k, v in sorted(daily[d].items())))
          PY
