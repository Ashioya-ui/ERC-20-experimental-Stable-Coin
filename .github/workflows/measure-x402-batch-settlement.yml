# Read-only: how much x402's own batch-settlement contracts are used on Base mainnet, beside our
# session escrow. Blockscout's public API only; no secrets, no transactions.
name: measure-x402-batch-settlement

on:
  push:
    branches: [measure-x402-batch-settlement]

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: |
          set -uo pipefail
          B=https://base.blockscout.com/api/v2
          get() { curl -fsS --retry 3 --retry-delay 2 "$B/$1"; }
          for a in \
            0x4020074e9dF2ce1deE5A9C1b5c3f541D02a10003 \
            0x4020806089470a89826cB9fB1f4059150b550004 \
            0x4020425FAf3B746C082C2f942b4E5159887B0005 \
            0x175925a679f389D905686D7E484b030Ccd7992CB; do
            echo "=== $a"
            get "addresses/$a/counters" | jq -c .
            info=$(get "addresses/$a")
            echo "$info" | jq -c '{name, is_verified, creation_transaction_hash, creator_address_hash}'
            ct=$(echo "$info" | jq -r '.creation_transaction_hash // empty')
            if [ -n "$ct" ]; then get "transactions/$ct" | jq -c '{created: .timestamp, block: .block_number}'; fi
            echo "--- latest direct transactions (newest first)"
            get "addresses/$a/transactions" | jq -r '.items[] | [.timestamp, (.method // "-"), .from.hash, (.status // "-")] | @tsv' | head -50
            echo "--- latest token transfers (newest first)"
            get "addresses/$a/token-transfers" | jq -r '.items[] | [.timestamp, .token.symbol, .total.value, .from.hash, .to.hash] | @tsv' | head -30
          done
