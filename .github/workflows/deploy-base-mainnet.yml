name: deploy-base-mainnet

# Deploys Spectrum to Base mainnet from GitHub's runners.
#
# One-time setup (repository Settings):
#   Secrets -> Actions:
#     BASE_RPC_URL           Base mainnet RPC (provider endpoint recommended)
#     ETHERSCAN_API_KEY      Etherscan API V2 key (covers Basescan)
#     DEPLOYER_PRIVATE_KEY   fresh key holding ~0.002 ETH + 2 USDC on Base. It ends with NO roles:
#                            all power goes to the admin Safe given below, so this key is
#                            worthless after the run. Rotate it out afterwards anyway.
#   Environments -> base-mainnet: add yourself as a required reviewer.
#
# Run: Actions -> deploy-base-mainnet -> Run workflow. Do a dry-run first, then broadcast.

on:
  workflow_dispatch:
    inputs:
      admin:
        description: "Admin Safe on Base (gets DEFAULT_ADMIN_ROLE + GUARDIAN_ROLE)"
        required: true
        type: string
      guardian:
        description: "Extra guardian (fast Safe or hardware wallet); 0x0 for none"
        required: false
        default: "0x0000000000000000000000000000000000000000"
        type: string
      mode:
        description: "dry-run = simulate on live Base state; broadcast = deploy for real"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, broadcast]
      confirm:
        description: "Type DEPLOY to allow a broadcast"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-base-mainnet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: base-mainnet
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      ADMIN: ${{ inputs.admin }}
      GUARDIAN: ${{ inputs.guardian }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check inputs, secrets and chain
        run: |
          set -euo pipefail
          [[ -n "$BASE_RPC_URL" ]] || { echo "::error::set the BASE_RPC_URL secret"; exit 1; }
          [[ "$(cast chain-id --rpc-url "$BASE_RPC_URL")" == "8453" ]] || { echo "::error::BASE_RPC_URL is not Base mainnet"; exit 1; }
          ADMIN=$(cast to-check-sum-address "$ADMIN")
          [[ "$(cast code "$ADMIN" --rpc-url "$BASE_RPC_URL")" != "0x" ]] || { echo "::error::admin $ADMIN has no code: create the Safe on Base first"; exit 1; }
          GUARDIAN=$(cast to-check-sum-address "$GUARDIAN")
          if [[ "$MODE" == "broadcast" ]]; then
            [[ "$CONFIRM" == "DEPLOY" ]] || { echo "::error::type DEPLOY in 'confirm' to broadcast"; exit 1; }
            [[ -n "$DEPLOYER_PRIVATE_KEY" ]] || { echo "::error::set the DEPLOYER_PRIVATE_KEY secret"; exit 1; }
            [[ -n "$ETHERSCAN_API_KEY" ]] || { echo "::error::set the ETHERSCAN_API_KEY secret"; exit 1; }
          fi
          if [[ -n "$DEPLOYER_PRIVATE_KEY" ]]; then
            DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          else
            DEPLOYER=0x000000000000000000000000000000000000bEEF   # dry-run sender
          fi
          [[ "$DEPLOYER" != "$ADMIN" ]] || { echo "::error::the deployer must not be the admin"; exit 1; }
          echo "ADMIN=$ADMIN" >> "$GITHUB_ENV"
          echo "GUARDIAN=$GUARDIAN" >> "$GITHUB_ENV"
          echo "DEPLOYER=$DEPLOYER" >> "$GITHUB_ENV"
          echo "deployer $DEPLOYER: $(cast balance "$DEPLOYER" --ether --rpc-url "$BASE_RPC_URL") ETH, $(cast call 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 'balanceOf(address)(uint256)' "$DEPLOYER" --rpc-url "$BASE_RPC_URL") USDC wei"

      - name: Tests, including the Base mainnet fork scenarios
        run: forge test

      - name: Write roles into config/8453.json
        run: |
          set -euo pipefail
          jq --arg a "$ADMIN" --arg g "$GUARDIAN" '.roles.admin=$a | .roles.guardian=$g | .roles.allowEoaAdmin=false' \
            config/8453.json > config/8453.tmp && mv config/8453.tmp config/8453.json
          if [[ "$MODE" == "dry-run" && "$DEPLOYER" == "0x000000000000000000000000000000000000bEEF" ]]; then
            # an unfunded dry-run sender cannot pay the 2 USDC dead-share seed
            jq '.params.seedUSDC=0' config/8453.json > config/8453.tmp && mv config/8453.tmp config/8453.json
          fi
          jq '.roles, .params' config/8453.json

      - name: Preflight - simulate the whole deployment against live Base state
        run: forge script script/DeployBaseMainnet.s.sol --rpc-url "$BASE_RPC_URL" --sender "$DEPLOYER"

      - name: Broadcast and verify on Basescan
        if: inputs.mode == 'broadcast'
        run: |
          forge script script/DeployBaseMainnet.s.sol --rpc-url "$BASE_RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" --sender "$DEPLOYER" \
            --broadcast --slow --verify --etherscan-api-key "$ETHERSCAN_API_KEY"

      - name: Post-deploy check (read-only, live chain)
        if: inputs.mode == 'broadcast'
        run: forge script script/PostDeployCheck.s.sol --rpc-url "$BASE_RPC_URL"

      - name: Summary
        if: inputs.mode == 'broadcast'
        run: |
          {
            echo "## Spectrum deployed on Base"
            echo '```json'
            cat deployments/8453.json
            echo '```'
            echo "Commit deployments/8453.json (artifact below) to the repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'broadcast'
        with:
          name: base-mainnet-deployment
          path: |
            deployments/8453.json
            config/8453.json
            broadcast/DeployBaseMainnet.s.sol/8453/run-latest.json
