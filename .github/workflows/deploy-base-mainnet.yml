name: deploy-base-mainnet

# Deploys Spectrum from GitHub's runners: to Base Sepolia for the dress rehearsal, then to
# Base mainnet. Same script, same checks; only the config file, RPC and environment differ.
#
# One-time setup (repository Settings):
#   Variables -> Actions:
#     DEPLOYER                 address of the deploying account (not a secret)
#   Secrets -> Actions:
#     BASE_RPC_URL             Base mainnet RPC (provider endpoint recommended)
#     BASE_SEPOLIA_RPC_URL     Base Sepolia RPC (for the dress rehearsal)
#     ETHERSCAN_API_KEY        Etherscan API V2 key (covers Basescan and Base Sepolia)
#     DEPLOYER_PRIVATE_KEY     key of the DEPLOYER address. Mainnet: ~0.003 ETH and
#                              1,252 USDC (seedUSDC 2 + seedCapitalUSDC 1,250) on Base.
#                              Sepolia: test ETH and 7 test USDC from Circle's faucet.
#                              It ends with NO roles: all power goes to the admin Safe given
#                              below. Use a fresh key and fund it just before the run.
#   Environments: base-mainnet (add yourself as a required reviewer) and base-sepolia.
#
# The private key is passed to the broadcast step only (Phase 4, A4): every other step,
# `forge test` included, runs dependency code that must never see it. Every action is pinned
# to a commit.
#
# Run: Actions -> deploy-base-mainnet -> Run workflow. Network base-sepolia first (dry-run,
# then broadcast), then base (dry-run, then broadcast).

on:
  workflow_dispatch:
    inputs:
      network:
        description: "base-sepolia = dress rehearsal; base = mainnet"
        required: true
        default: base-sepolia
        type: choice
        options: [base-sepolia, base]
      admin:
        description: "Admin Safe on that network (gets DEFAULT_ADMIN_ROLE + GUARDIAN_ROLE)"
        required: true
        type: string
      guardian:
        description: "Extra guardian (fast Safe or hardware wallet); 0x0 for none"
        required: false
        default: "0x0000000000000000000000000000000000000000"
        type: string
      mode:
        description: "dry-run = simulate on live chain state; broadcast = deploy for real"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, broadcast]
      confirm:
        description: "Type DEPLOY to allow a broadcast"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ inputs.network }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'base' && 'base-mainnet' || 'base-sepolia' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NETWORK: ${{ inputs.network }}
      CHAIN_ID: ${{ inputs.network == 'base' && '8453' || '84532' }}
      RPC_URL: ${{ inputs.network == 'base' && secrets.BASE_RPC_URL || secrets.BASE_SEPOLIA_RPC_URL }}
      ADMIN: ${{ inputs.admin }}
      GUARDIAN: ${{ inputs.guardian }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      # Not a secret: the address only. The key itself reaches the broadcast step alone.
      DEPLOYER_ADDRESS: ${{ vars.DEPLOYER }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Check inputs, secrets and chain
        env:
          # Whether the secrets are set, without putting their values into this step (A4).
          HAS_DEPLOYER_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY != '' }}
          HAS_ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_API_KEY != '' }}
        run: |
          set -euo pipefail
          CONFIG="config/$CHAIN_ID.json"
          [[ -n "$RPC_URL" ]] || { echo "::error::set the RPC secret for $NETWORK (BASE_RPC_URL or BASE_SEPOLIA_RPC_URL)"; exit 1; }
          [[ "$(cast chain-id --rpc-url "$RPC_URL")" == "$CHAIN_ID" ]] || { echo "::error::the RPC is not chain $CHAIN_ID"; exit 1; }
          ADMIN=$(cast to-check-sum-address "$ADMIN")
          if [[ "$NETWORK" == "base" || "$(jq -r .roles.allowEoaAdmin "$CONFIG")" != "true" ]]; then
            [[ "$(cast code "$ADMIN" --rpc-url "$RPC_URL")" != "0x" ]] || { echo "::error::admin $ADMIN has no code: create the Safe on $NETWORK first"; exit 1; }
          fi
          GUARDIAN=$(cast to-check-sum-address "$GUARDIAN")
          if [[ "$MODE" == "broadcast" ]]; then
            [[ "$CONFIRM" == "DEPLOY" ]] || { echo "::error::type DEPLOY in 'confirm' to broadcast"; exit 1; }
            [[ -n "$DEPLOYER_ADDRESS" ]] || { echo "::error::set the DEPLOYER repository variable to the deployer's address"; exit 1; }
            [[ "$HAS_DEPLOYER_KEY" == "true" ]] || { echo "::error::set the DEPLOYER_PRIVATE_KEY secret"; exit 1; }
            [[ "$HAS_ETHERSCAN_KEY" == "true" ]] || { echo "::error::set the ETHERSCAN_API_KEY secret"; exit 1; }
            DEPLOYER=$(cast to-check-sum-address "$DEPLOYER_ADDRESS")
          else
            DEPLOYER=0x000000000000000000000000000000000000bEEF   # unfunded dry-run sender
          fi
          [[ "$DEPLOYER" != "$ADMIN" ]] || { echo "::error::the deployer must not be the admin"; exit 1; }
          USDC=$(jq -r .external.usdc "$CONFIG")
          {
            echo "CONFIG=$CONFIG"
            echo "ADMIN=$ADMIN"
            echo "GUARDIAN=$GUARDIAN"
            echo "DEPLOYER=$DEPLOYER"
          } >> "$GITHUB_ENV"
          echo "deployer $DEPLOYER on $NETWORK: $(cast balance "$DEPLOYER" --ether --rpc-url "$RPC_URL") ETH, $(cast call "$USDC" 'balanceOf(address)(uint256)' "$DEPLOYER" --rpc-url "$RPC_URL") USDC wei"

      - name: Tests (the Base mainnet fork scenarios run when deploying to mainnet)
        env:
          BASE_RPC_URL: ${{ inputs.network == 'base' && secrets.BASE_RPC_URL || '' }}
        run: forge test

      - name: Tests in isolated mode (per-call gas budgets)
        run: forge test --isolate

      - name: Write roles into the config
        run: |
          set -euo pipefail
          if [[ "$NETWORK" == "base" ]]; then EOA=false; else EOA=$(jq -r .roles.allowEoaAdmin "$CONFIG"); fi
          jq --arg a "$ADMIN" --arg g "$GUARDIAN" --argjson e "$EOA" '.roles.admin=$a | .roles.guardian=$g | .roles.allowEoaAdmin=$e' \
            "$CONFIG" > config.tmp && mv config.tmp "$CONFIG"
          if [[ "$MODE" == "dry-run" ]]; then
            # an unfunded dry-run sender cannot pay the seed amounts
            jq '.params.seedUSDC=0 | .params.seedCapitalUSDC=0' "$CONFIG" > config.tmp && mv config.tmp "$CONFIG"
          fi
          jq '.roles, .params' "$CONFIG"

      - name: Preflight - simulate the whole deployment against live chain state
        run: forge script script/DeployBaseMainnet.s.sol --rpc-url "$RPC_URL" --sender "$DEPLOYER"

      - name: Broadcast and verify on the explorer
        if: inputs.mode == 'broadcast'
        env:
          # The only step that sees the key. It must match the DEPLOYER variable.
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -euo pipefail
          KEY_ADDRESS=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          [[ "$(cast to-check-sum-address "$KEY_ADDRESS")" == "$DEPLOYER" ]] || {
            echo "::error::DEPLOYER_PRIVATE_KEY does not match the DEPLOYER variable"; exit 1; }
          forge script script/DeployBaseMainnet.s.sol --rpc-url "$RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" --sender "$DEPLOYER" \
            --broadcast --slow --verify --etherscan-api-key "$ETHERSCAN_API_KEY"

      - name: Post-deploy check (read-only, live chain)
        if: inputs.mode == 'broadcast'
        run: forge script script/PostDeployCheck.s.sol --rpc-url "$RPC_URL"

      - name: Summary
        if: inputs.mode == 'broadcast'
        run: |
          {
            echo "## Spectrum deployed on $NETWORK"
            echo '```json'
            cat "deployments/$CHAIN_ID.json"
            echo '```'
            echo "Commit deployments/$CHAIN_ID.json (artifact below) to the repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.mode == 'broadcast'
        with:
          name: deployment-${{ inputs.network }}
          path: |
            deployments/${{ inputs.network == 'base' && '8453' || '84532' }}.json
            config/${{ inputs.network == 'base' && '8453' || '84532' }}.json
            broadcast/DeployBaseMainnet.s.sol/${{ inputs.network == 'base' && '8453' || '84532' }}/run-latest.json
