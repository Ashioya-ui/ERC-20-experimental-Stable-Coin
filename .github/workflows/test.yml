name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    name: Foundry build, tests and mainnet rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build (sizes)
        run: forge build --sizes

      - name: Test (10k fuzz runs, invariants 1,024 x 256; Base fork scenarios if the secret is set)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vv

      - name: Mainnet rehearsal on anvil
        env:
          FOUNDRY_PROFILE: default
        run: script/rehearsal/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-log
          path: rehearsal/latest.log
