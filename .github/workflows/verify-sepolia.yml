name: verify-sepolia

# Publishes verified source for the live Base Sepolia deployment.
#
# Sourcify is the primary verifier because it needs no API key: it matches the compiled bytecode
# and metadata against the submitted sources, and the result is public at repo.sourcify.dev and
# rendered by Blockscout (base-sepolia.blockscout.com). BaseScan verification runs too, but only
# if an ETHERSCAN_API_KEY secret exists; its absence does not fail the job.
#
# Addresses come from deployments/84532.json in the repository.
#
# RUN: push to the `verify-sepolia` branch, or Run workflow.

on:
  push:
    branches: [verify-sepolia]
  workflow_dispatch:

concurrency:
  group: verify-sepolia
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify sources on Sourcify (and BaseScan if a key exists)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CHAIN_ID: "84532"
      RPC: https://sepolia.base.org
      HAS_SCAN: ${{ secrets.ETHERSCAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          # This job runs `forge build` over four git submodules and holds the Etherscan key.
          # It must not also carry a push credential that any of that code could read out of
          # .git/config (review S-02). The results travel to `publish` as an artifact instead.
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Build with the same settings the deployment used
        run: forge build

      - name: Verify on Sourcify
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -uo pipefail
          D="deployments/$CHAIN_ID.json"
          R="deployments/$CHAIN_ID-router.json"
          [[ -f "$D" ]] || { echo "::error::$D missing"; exit 1; }

          # key  source-file  contract-name, in deployment order.
          TARGETS=(
            "sUSD       src/SpectralToken.sol         SpectralToken"
            "treasury   src/AutonomousTreasury.sol    AutonomousTreasury"
            "oracle     src/SpectralEntropyOracle.sol SpectralEntropyOracle"
            "stabilizer src/SpectralStabilizer.sol    SpectralStabilizer"
            "wsUSD      src/WrappedSUSD.sol           WrappedSUSD"
            "lens       src/SpectrumLens.sol          SpectrumLens"
            "hook       src/SpectralHook.sol          SpectralHook"
          )
          ok=0; fail=0
          : > verify-results.txt
          verify_one() {
            local addr="$1" target="$2" outcome=fail out reason
            echo "::group::$target  $addr"
            # bytecode_hash = "none" in foundry.toml, so there is no metadata hash in the
            # deployed code and Sourcify can only ever award a partial match. That is expected
            # and still publishes readable source; it is not a failure.
            out=$(forge verify-contract "$addr" "$target" \
                   --chain-id "$CHAIN_ID" --verifier sourcify \
                   --verifier-url https://sourcify.dev/server --watch 2>&1) && outcome=ok
            echo "$out" | tail -25
            [[ "$outcome" == ok ]] && ok=$((ok+1)) || fail=$((fail+1))
            # keep why, so a rejection is diagnosable without the run log
            reason=$(echo "$out" | grep -iE "error|cannot|fail|already|perfect|partial|match|invalid" \
                     | tail -3 | tr '\n' ';' | cut -c1-300)
            printf '%s\t%s\t%s\t%s\n' "$outcome" "$addr" "$target" "${reason:-no output}" >> verify-results.txt
            if [[ "$HAS_SCAN" == "true" ]]; then
              forge verify-contract "$addr" "$target" --chain-id "$CHAIN_ID" \
                --etherscan-api-key "$ETHERSCAN_API_KEY" --watch 2>&1 | tail -5 || true
            fi
            echo "::endgroup::"
          }
          for row in "${TARGETS[@]}"; do
            read -r key file name <<< "$row"
            addr=$(jq -r ".$key // empty" "$D")
            [[ "$addr" == 0x* ]] || { echo "no address for $key"; continue; }
            verify_one "$addr" "$file:$name"
          done
          if [[ -f "$R" ]]; then
            raddr=$(jq -r '.router // empty' "$R")
            [[ "$raddr" == 0x* ]] && verify_one "$raddr" "src/periphery/SpectrumPayRouter.sol:SpectrumPayRouter"
          fi
          echo "SOURCIFY_OK=$ok" >> "$GITHUB_ENV"
          echo "SOURCIFY_FAIL=$fail" >> "$GITHUB_ENV"
          echo "verified $ok, not accepted $fail"

      - name: Ask Sourcify what it actually holds
        if: always()
        run: |
          set -uo pipefail
          D="deployments/$CHAIN_ID.json"; R="deployments/$CHAIN_ID-router.json"
          ADDRS=$(jq -r '[.sUSD,.treasury,.oracle,.stabilizer,.wsUSD,.lens,.hook] | @tsv' "$D")
          [[ -f "$R" ]] && ADDRS="$ADDRS	$(jq -r '.router // empty' "$R")"
          : > sourcify-status.txt
          : > sourcify-raw.txt
          exact=0; partial=0; absent=0
          for a in $ADDRS; do
            [[ "$a" == 0x* ]] || continue
            # Sourcify moved to a V2 API and deprecated check-all-by-addresses, so ask both and
            # keep the raw answers. A disagreement between forge and one endpoint is not evidence
            # of anything until the actual responses are on the table.
            v2=$(curl -sS -w '\n<<HTTP:%{http_code}>>' --max-time 30 \
                  "https://sourcify.dev/server/v2/contract/$CHAIN_ID/$a" 2>&1 || echo "curl-failed")
            legacy=$(curl -sS -w '\n<<HTTP:%{http_code}>>' --max-time 30 \
                  "https://sourcify.dev/server/check-all-by-addresses?addresses=$a&chainIds=$CHAIN_ID" 2>&1 || echo "curl-failed")
            { echo "### $a"; echo "-- v2:"; echo "$v2" | head -c 600; echo;
              echo "-- legacy:"; echo "$legacy" | head -c 400; echo; } >> sourcify-raw.txt

            # V2 is authoritative: it reports match as "exact_match" or "match".
            m=$(echo "$v2" | sed 's/<<HTTP:[0-9]*>>//' | jq -r '.match // empty' 2>/dev/null || true)
            if [[ -z "$m" ]]; then
              m=$(echo "$legacy" | sed 's/<<HTTP:[0-9]*>>//' | jq -r --arg c "$CHAIN_ID" \
                   '(.[0].chainIds // []) | map(select(.chainId == $c)) | (.[0].status // "")' 2>/dev/null || true)
            fi
            case "$m" in
              exact_match|perfect) st=exact; exact=$((exact+1));;
              match|partial)       st=partial; partial=$((partial+1));;
              *)                   st=absent; absent=$((absent+1));;
            esac
            printf '%s\t%s\n' "$st" "$a" >> sourcify-status.txt
            echo "$st  $a"
          done
          echo "EXACT=$exact" >> "$GITHUB_ENV"
          echo "PARTIAL=$partial" >> "$GITHUB_ENV"
          echo "ABSENT=$absent" >> "$GITHUB_ENV"
          echo "sourcify holds: $exact exact, $partial partial, $absent absent"

      - name: Write the verification record
        if: always()
        run: |
          set -euo pipefail
          [[ -f verify-results.txt || -f sourcify-status.txt || -f sourcify-raw.txt ]] || exit 0
          mkdir -p deployments
          { echo "# Sourcify verification, Base Sepolia, run ${{ github.run_id }}"
            echo "# forge said: outcome  address  source:contract  reason"
            cat verify-results.txt 2>/dev/null || echo "(no forge results)"
            echo ""
            echo "# sourcify holds: status  address   (exact | partial | absent)"
            cat sourcify-status.txt 2>/dev/null || echo "(no status query)"
            echo ""
            echo "# raw API responses, so a disagreement is diagnosable:"
            cat sourcify-raw.txt 2>/dev/null || echo "(none)"
            echo ""
            echo "# totals: exact=${EXACT:-?} partial=${PARTIAL:-?} absent=${ABSENT:-?}"
          } > deployments/84532-verification.txt
          cat deployments/84532-verification.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: sepolia-verification
          path: deployments/84532-verification.txt
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          D="deployments/$CHAIN_ID.json"
          {
            echo "## Verified source — Base Sepolia"
            echo ""
            echo "Sourcify holds: **${EXACT:-0} exact**, **${PARTIAL:-0} partial**, **${ABSENT:-0} absent**."
            echo "forge accepted ${SOURCIFY_OK:-0}, rejected ${SOURCIFY_FAIL:-0}. BaseScan ran: ${HAS_SCAN}."
            echo ""
            echo "A partial match is the expected best result here: foundry.toml sets"
            echo "\`bytecode_hash = \"none\"\`, so the deployed code carries no metadata hash for"
            echo "Sourcify to pin an exact match to. Source is published and readable either way."
            echo ""
            echo "| contract | sourcify | blockscout |"
            echo "|---|---|---|"
            for k in sUSD treasury oracle stabilizer wsUSD lens hook; do
              a=$(jq -r ".$k // empty" "$D"); [[ -n "$a" ]] || continue
              echo "| $k | [lookup](https://sourcify.dev/server/v2/contract/$CHAIN_ID/$a) | [view](https://base-sepolia.blockscout.com/address/$a?tab=contract) |"
            done
            r=$(jq -r '.router // empty' "deployments/$CHAIN_ID-router.json" 2>/dev/null || true)
            [[ -n "$r" ]] && echo "| SpectrumPayRouter | [lookup](https://sourcify.dev/server/v2/contract/$CHAIN_ID/$r) | [view](https://base-sepolia.blockscout.com/address/$r?tab=contract) |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the verification record to a branch
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job holds the only git credential in the workflow and runs no build, no
      # dependency code and no secret. It is the pattern deploy-sepolia-rail.yml already uses.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: sepolia-verification
          path: incoming
      - name: Commit and push
        run: |
          set -uo pipefail
          [[ -f incoming/84532-verification.txt ]] || { echo "nothing to publish"; exit 0; }
          mkdir -p deployments
          cp -f incoming/84532-verification.txt deployments/84532-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deployments/84532-verification.txt
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "verify(base-sepolia): sourcify results from run ${{ github.run_id }}"
          # Bookkeeping: a push that does not land must not turn a successful verification run
          # into a red build. The record is in the artifact and in the job summary either way.
          if git push origin "HEAD:refs/heads/deployments/verify-${{ github.run_id }}"; then
            echo "pushed to deployments/verify-${{ github.run_id }}"
          else
            echo "::warning::could not push the verification record; it is in the artifact"
          fi
