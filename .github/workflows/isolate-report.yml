name: isolate-report

# Runs the main CI's isolated-mode test step exactly as test.yml does (FOUNDRY_PROFILE=ci,
# `forge test --isolate`) and commits which tests fail, with their traces, to a branch: the
# Actions log host is not reachable from where this is analysed. No secrets.
#
# RUN: push to `isolate-report`. The report lands on ci/isolate-report-<run>.

on:
  push:
    branches: [isolate-report]

permissions: {}

env:
  FOUNDRY_PROFILE: ci

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - id: run
        run: |
          set +e
          forge test --isolate -vvv > /tmp/iso.txt 2>&1; R=$?
          set -e
          {
            echo "report<<ISO_EOF"; echo "exit $R"
            echo "== failing tests"; grep -E '^\[FAIL' /tmp/iso.txt | head -60
            echo "== summary"; grep -E 'Suite result: FAILED|Ran [0-9]+ test suites|Encountered' /tmp/iso.txt | head -40
            echo "== failure detail"; awk '/^Failing tests:/{f=1} f' /tmp/iso.txt | head -c 30000
            echo "ISO_EOF"
          } >> "$GITHUB_OUTPUT"
          grep -E '^\[FAIL|Ran [0-9]+ test suites' /tmp/iso.txt | head -40

  publish:
    needs: isolate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - env:
          REPORT: ${{ needs.isolate.outputs.report }}
        run: |
          set -euo pipefail
          mkdir -p ci
          printf '%s\n' "$REPORT" > ci/isolate-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/isolate-report.txt
          git commit -q -m "ci: isolated-mode report from run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/ci/isolate-report-${{ github.run_id }}"
