name: audit-live-state

# Independent audit probe: read-only inspection of the live Base Sepolia deployment and of
# what Sourcify actually holds. Holds no secrets. RUN: push to the `audit-live-state` branch.

on:
  push:
    branches: [audit-live-state]
  workflow_dispatch:

concurrency:
  group: audit-live-state
  cancel-in-progress: false

permissions: {}

jobs:
  inspect:
    name: Read live chain state (no credentials, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHAIN_ID: "84532"
      RPC: https://sepolia.base.org
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1


      - name: Targeted probes (senders, balances, access control)
        run: bash audit/probe/probe3.sh > probe3.txt 2>&1 || true; cat probe3.txt

      - name: PostDeployCheck against the config AS COMMITTED
        run: |
          forge script script/PostDeployCheck.s.sol --rpc-url "$RPC" > pdc-as-committed.txt 2>&1 || true
          tail -5 pdc-as-committed.txt

      - name: PostDeployCheck with roles.admin repaired from the deployment record
        run: |
          jq --arg a "$(jq -r .admin deployments/84532.json)" '.roles.admin=$a' config/84532.json > config/84532.repaired.json
          SPECTRUM_CONFIG=config/84532.repaired.json \
            forge script script/PostDeployCheck.s.sol --rpc-url "$RPC" > pdc-repaired.txt 2>&1 || true
          tail -60 pdc-repaired.txt

      - name: Unused attack-probe step (superseded by probe3)
        if: false
        run: |
          true
      - name: Old probes (disabled)
        if: false
        run: |
          D=deployments/84532.json
          STAB=$(jq -r .stabilizer $D); DEP=$(jq -r .deployer $D); ADM=$(jq -r .admin $D)
          TRE=$(jq -r .treasury $D);    VA=$(jq -r .vault $D); USDC=$(jq -r .usdc $D)
          { echo "## pause() from the deployer (want: AccessControlUnauthorizedAccount)"
            cast call "$STAB" 'pause()' --from "$DEP" --rpc-url "$RPC" 2>&1 | head -3
            echo "## setSupplyCap(uint256 max) from the deployer (want: revert)"
            cast call "$STAB" 'setSupplyCap(uint256)' 115792089237316195423570985008687907853269984665640564039457584007913129639935 --from "$DEP" --rpc-url "$RPC" 2>&1 | head -3
            echo "## proposeVault from the deployer (want: revert)"
            cast call "$STAB" 'proposeVault(address)' "$VA" --from "$DEP" --rpc-url "$RPC" 2>&1 | head -3
            echo "## pause() from the admin (want: success -> admin CAN pause)"
            cast call "$STAB" 'pause()' --from "$ADM" --rpc-url "$RPC" 2>&1 | head -3
            echo "## setSupplyCap(0) from the admin (want: success -> admin CAN freeze mints)"
            cast call "$STAB" 'setSupplyCap(uint256)' 0 --from "$ADM" --rpc-url "$RPC" 2>&1 | head -3
            echo "## treasury.withdrawReserve from a stranger (want: NotStabilizer)"
            cast call "$TRE" 'withdrawReserve(uint256,address)(uint256)' 1 0x00000000000000000000000000000000DeaDBeef --from 0x00000000000000000000000000000000DeaDBeef --rpc-url "$RPC" 2>&1 | head -3
            echo "## token.mint from a stranger (want: NotStabilizer)"
            cast call "$(jq -r .sUSD $D)" 'mint(address,uint256)(uint256)' 0x00000000000000000000000000000000DeaDBeef 1000000000000000000 --from 0x00000000000000000000000000000000DeaDBeef --rpc-url "$RPC" 2>&1 | head -3
            echo "## rebase() from a stranger (permissionless by design)"
            cast call "$STAB" 'rebase()(bool)' --from 0x00000000000000000000000000000000DeaDBeef --rpc-url "$RPC" 2>&1 | head -3
            echo "## sync() from a stranger (permissionless by design)"
            cast call "$STAB" 'sync()(bool)' --from 0x00000000000000000000000000000000DeaDBeef --rpc-url "$RPC" 2>&1 | head -3
            echo "## deployer USDC / ETH left on the CI key"
            cast call "$USDC" 'balanceOf(address)(uint256)' "$DEP" --rpc-url "$RPC" 2>&1 | head -2
            cast balance "$DEP" --rpc-url "$RPC" 2>&1 | head -2
            echo "## deployer tx count (nonce)"
            cast nonce "$DEP" --rpc-url "$RPC" 2>&1 | head -2
          } > attack-probes.txt 2>&1
          cat attack-probes.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: audit-live-state
          path: |
            probe3.txt
            pdc-as-committed.txt
            pdc-repaired.txt
            attack-probes.txt

  publish:
    name: Publish the findings to a branch
    needs: inspect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        continue-on-error: true
        with:
          name: audit-live-state
          path: incoming
      - name: Commit and push
        if: always()
        run: |
          mkdir -p audit/live
          cp -f incoming/*.txt audit/live/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit/live
          git commit -q -m "audit: live Base Sepolia state, run ${{ github.run_id }}" || true
          git push origin "HEAD:refs/heads/deployments/audit-${{ github.run_id }}"
